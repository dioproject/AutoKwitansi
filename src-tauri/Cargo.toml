[package]
name = "auto-kwitansi"
version = "3.3.1"
description = "Aplikasi Desktop Pembuatan Kwitansi SPJ Lembaga Sekolah"
authors = ["AutoKwitansi"]
edition = "2021"

[lib]
name = "auto_kwitansi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.12"
regex = "1"
rand = "0.8"
serialport = "4"
